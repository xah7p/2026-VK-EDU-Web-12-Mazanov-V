<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraStack</title>
    <link rel="icon" type="image/x-icon" href="static/img/favicon.ico">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
            <div class="container">
                <a class="navbar-brand" href="index.html">TerraStack</a>
                <button class="navbar-toggler shadow-none border-0 px-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <form class="d-flex mx-auto my-3 my-lg-0 w-100" role="search" style="max-width: 450px;">
                        <input class="form-control form-control-search shadow-none" type="search" placeholder="Search topics..." aria-label="Search"/>
                        <button class="btn btn-search text-white fw-bold" style="border-radius: 0 8px 8px 0;" type="submit">Search</button>
                    </form>
                    <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-3 ms-lg-4">
                        <a href="ask.html" class="btn btn-ask fw-bold px-3">Ask Question</a>
                        <div class="user-auth d-flex align-items-center gap-2">
                            <img src="static/img/avatar1.jpeg" class="user-avatar" alt="User">
                            <div class="user-section">
                                <div class="content_name">xah7p</div>
                                <div class="content_links">
                                    <a href="profile.html">Settings</a> |
                                    <a href="#">Logout</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-4 flex-grow-1">
        <div class="row">
            <section class="col-12 col-lg-9 mb-4">
                <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                    <h2 class="m-0 fw-bold text-main">Settings: xah7p</h2>
                </div>
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <form>
                            <div class="row mb-4 align-items-center">
                                <label for="profileLogin" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Login</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control bg-light text-muted" id="profileLogin" value="xah7p" readonly>
                                    <small class="text-muted">Your login cannot be changed.</small>
                                </div>
                            </div>
                            <div class="row mb-4 align-items-center">
                                <label for="profileEmail" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Email</label>
                                <div class="col-sm-9">
                                    <input type="email" class="form-control" id="profileEmail" value="xah7p@example.com">
                                </div>
                            </div>
                            <div class="row mb-4 align-items-center">
                                <label for="profileNickname" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">NickName</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="profileNickname" value="Xah">
                                </div>
                            </div>
                            <div class="row mb-5">
                                <label class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Upload avatar</label>
                                <div class="col-sm-9">
                                    <div class="d-flex flex-column gap-3 align-items-start">
                                        <div class="border rounded d-flex align-items-center justify-content-center bg-light overflow-hidden shadow-sm" style="width: 120px; height: 120px;">
                                            <img src="static/img/avatar1.jpeg" alt="Current Avatar" style="width: 100%; height: 100%; object-fit: cover;">
                                        </div>
                                        <input class="form-control" type="file" id="profileAvatar">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-3"></div>
                                <div class="col-sm-9">
                                    <button type="submit" class="btn btn-ask fw-bold px-5 py-2">Save</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
            <aside class="col-12 col-lg-3">
                <section class="mb-4">
                    <div class="card sidebar-card">
                        <div class="card-body p-4">
                            <h5 class="card-title mb-3 fw-bold">Popular Topics</h5>
                            <div class="d-flex flex-wrap gap-2">
                                <span class="badge sidebar-badge tag-modding"><a style="all:unset; cursor:pointer" href="tag.html">#modding</a></span>
                                <span class="badge sidebar-badge tag-boss"><a style="all:unset; cursor:pointer" href="tag.html">#boss-guides</a></span>
                                <span class="badge sidebar-badge tag-farms"><a style="all:unset; cursor:pointer" href="tag.html">#farms</a></span>
                                <span class="badge sidebar-badge tag-hardmode"><a style="all:unset; cursor:pointer" href="tag.html">#hardmode</a></span>
                            </div>
                        </div>
                    </div>
                </section>
                <section>
                    <div class="card sidebar-card">
                        <div class="card-body p-4">
                            <h5 class="card-title mb-3 fw-bold">Best Members</h5>
                            <a class="d-flex align-items-center text-decoration-none text-secondary mb-2 hover-bg-light p-2 rounded member-item" href="#">
                                <img src="static/img/avatar3.jpg" class="rounded me-3 avatar-36" alt="Member">
                                <span style="font-weight: 500; color: var(--text-main);">kek123</span>
                            </a>
                            <a class="d-flex align-items-center text-decoration-none text-secondary mb-2 hover-bg-light p-2 rounded member-item" href="#">
                                <img src="static/img/avatar4.png" class="rounded me-3 avatar-36" alt="Member">
                                <span style="font-weight: 500; color: var(--text-main);">lol1488</span>
                            </a>
                        </div>
                    </div>
                </section>
            </aside>
        </div>
    </main>
    <footer class="mt-auto py-4" style="background-color: var(--nav-bg); border-top: 1px solid var(--border-color);">
        <div class="container text-center">
            <span style="color: var(--text-muted); font-size: 0.9rem;">
                &copy; 2026 TerraStack - VK EDU Web Project.
            </span>
        </div>
    </footer>
    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
