{% extends "layout/base.html" %}
{% block content %}
<div class="d-flex align-items-center mb-4 pb-2 border-bottom">
    <h2 class="m-0 fw-bold" style="color: var(--text-main);">Registration</h2>
</div>
<div class="alert alert-danger mb-4 d-flex align-items-center" role="alert">
    <div>Please fix the errors below to complete your registration.</div>
</div>
<div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4 p-md-5">
        <form>
            <div class="row mb-4 align-items-center">
                <label for="regLogin" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Login</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="regLogin" placeholder="dr_pepper">
                </div>
            </div>
            <div class="row mb-4 align-items-center">
                <label for="regEmail" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Email</label>
                <div class="col-sm-9">
                    <input type="email" class="form-control is-invalid" id="regEmail" value="dr.pepper@mail">
                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>
            </div>
            <div class="row mb-4 align-items-center">
                <label for="regNickname" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">NickName</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="regNickname" placeholder="Dr. Pepper">
                </div>
            </div>
            <div class="row mb-4 align-items-center">
                <label for="regPassword" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Password</label>
                <div class="col-sm-9">
                    <input type="password" class="form-control" id="regPassword" placeholder="Write your password here">
                </div>
            </div>
            <div class="row mb-4 align-items-center">
                <label for="regPasswordRepeat" class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Repeat password</label>
                <div class="col-sm-9">
                    <input type="password" class="form-control" id="regPasswordRepeat" placeholder="Repeat your password">
                </div>
            </div>
            <div class="row mb-5">
                <label class="col-sm-3 col-form-label fw-bold" style="color: var(--text-main);">Upload avatar</label>
                <div class="col-sm-9">
                    <div class="d-flex flex-column gap-3 align-items-start">
                        <div class="border rounded d-flex align-items-center justify-content-center bg-light" style="width: 120px; height: 120px; border-style: dashed !important; border-width: 2px !important; color: #a0b3a8;">
                            <span>avatar</span>
                        </div>
                        <input class="form-control" type="file" id="regAvatar">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-3"></div>
                <div class="col-sm-9 d-flex align-items-center gap-4">
                    <button type="submit" class="btn btn-ask fw-bold px-4 py-2">Register</button>
                    <a href={% url "core:login" %} class="text-decoration-none" style="color: var(--accent-primary);">Already have an account?</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
