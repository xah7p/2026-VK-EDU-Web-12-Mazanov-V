services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vkedu_web}
      POSTGRES_USER: ${POSTGRES_USER:-vkedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vkedu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vkedu} -d ${POSTGRES_DB:-vkedu_web}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./config.json:/centrifugo/config.json:ro
    ports:
      - "${CENTRIFUGO_PORT:-9000}:9000"
    depends_on:
      redis:
        condition: service_healthy

  maildev:
    image: maildev/maildev:latest
    ports:
      - "1080:1080"
      - "1025:1025"

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
      maildev:
        condition: service_started
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-dev-only}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      POSTGRES_DB: ${POSTGRES_DB:-vkedu_web}
      POSTGRES_USER: ${POSTGRES_USER:-vkedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vkedu}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: "5432"
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REDIS_BROKER_DB: ${REDIS_BROKER_DB:-2}
      REDIS_BEAT_DB: ${REDIS_BEAT_DB:-3}
      CENTRIFUGO_HOST: ${CENTRIFUGO_HOST:-centrifugo}
      CENTRIFUGO_PORT: ${CENTRIFUGO_PORT:-9000}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-17I-1zkkrLHHMeK_nOzCW7oxtYCGWvHJqXtsyIHKTkDrxBJblIK4vFsdJvyCBMGshh5z_Gk0Cu0yDBrdwYtiAA}
      CENTRIFUGO_TOKEN_KEY: ${CENTRIFUGO_TOKEN_KEY:-vheAhEAv99bP68zPTexlGCl7cyIbHXgq_v-r_Sh7wUEKmXn6q3D6tm5A06ksFBjEG3NokcJ96KicBdpzBp9HFw}
      EMAIL_HOST: ${EMAIL_HOST:-maildev}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@local.dev}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  celery_worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-dev-only}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      POSTGRES_DB: ${POSTGRES_DB:-vkedu_web}
      POSTGRES_USER: ${POSTGRES_USER:-vkedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vkedu}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: "5432"
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REDIS_BROKER_DB: ${REDIS_BROKER_DB:-2}
      REDIS_BEAT_DB: ${REDIS_BEAT_DB:-3}
      CENTRIFUGO_HOST: ${CENTRIFUGO_HOST:-centrifugo}
      CENTRIFUGO_PORT: ${CENTRIFUGO_PORT:-9000}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-17I-1zkkrLHHMeK_nOzCW7oxtYCGWvHJqXtsyIHKTkDrxBJblIK4vFsdJvyCBMGshh5z_Gk0Cu0yDBrdwYtiAA}
      CENTRIFUGO_TOKEN_KEY: ${CENTRIFUGO_TOKEN_KEY:-vheAhEAv99bP68zPTexlGCl7cyIbHXgq_v-r_Sh7wUEKmXn6q3D6tm5A06ksFBjEG3NokcJ96KicBdpzBp9HFw}
      EMAIL_HOST: ${EMAIL_HOST:-maildev}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@local.dev}
    command: celery -A application worker --loglevel=info

  celery_beat:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-dev-only}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      POSTGRES_DB: ${POSTGRES_DB:-vkedu_web}
      POSTGRES_USER: ${POSTGRES_USER:-vkedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vkedu}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: "5432"
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REDIS_BROKER_DB: ${REDIS_BROKER_DB:-2}
      REDIS_BEAT_DB: ${REDIS_BEAT_DB:-3}
      CENTRIFUGO_HOST: ${CENTRIFUGO_HOST:-centrifugo}
      CENTRIFUGO_PORT: ${CENTRIFUGO_PORT:-9000}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-17I-1zkkrLHHMeK_nOzCW7oxtYCGWvHJqXtsyIHKTkDrxBJblIK4vFsdJvyCBMGshh5z_Gk0Cu0yDBrdwYtiAA}
      CENTRIFUGO_TOKEN_KEY: ${CENTRIFUGO_TOKEN_KEY:-vheAhEAv99bP68zPTexlGCl7cyIbHXgq_v-r_Sh7wUEKmXn6q3D6tm5A06ksFBjEG3NokcJ96KicBdpzBp9HFw}
      EMAIL_HOST: ${EMAIL_HOST:-maildev}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@local.dev}
    command: celery -A application beat --loglevel=info --scheduler redbeat.RedBeatScheduler

volumes:
  media_volume:
  postgres_data:
  redis_data:
