services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vkedu_web}
      POSTGRES_USER: ${POSTGRES_USER:-vkedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vkedu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vkedu} -d ${POSTGRES_DB:-vkedu_web}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-dev-only}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      POSTGRES_DB: ${POSTGRES_DB:-vkedu_web}
      POSTGRES_USER: ${POSTGRES_USER:-vkedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vkedu}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  media_volume:
  postgres_data:
