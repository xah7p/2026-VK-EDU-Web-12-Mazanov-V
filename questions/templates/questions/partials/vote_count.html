<div class="vote-vertical">
    {% if user.is_authenticated %}
    <button type="button" class="vote-btn" title="Like">&#9650;</button>
    {% else %}
    <button type="button" class="vote-btn" title="Log in to like" disabled style="pointer-events: none;">&#9650;</button>
    {% endif %}
    {% with vc=object.vote_count|default:0 %}
    {% if vc >= 0 %}
        <div class="vote-count" style="color: #2b9a79;">{{ vc }}</div>
    {% else %}
        <div class="vote-count" style="color: #e90c0c;">{{ vc }}</div>
    {% endif %}
    {% endwith %}
    {% if user.is_authenticated %}
    <button type="button" class="vote-btn" title="Dislike">&#9660;</button>
    {% else %}
    <button type="button" class="vote-btn" title="Log in to dislike" disabled style="pointer-events: none;">&#9660;</button>
    {% endif %}
</div>
