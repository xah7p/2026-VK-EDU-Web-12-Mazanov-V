{% load user_extras humanize %}
<div id="answer-{{ answer.id }}" class="card mb-4 border-0 border-bottom rounded-0">
    <div class="card-body p-3 d-flex gap-4">
        <div class="d-flex flex-column align-items-center" style="min-width: 60px;">
            {% include "questions/partials/vote_count.html" with object=answer %}
        </div>
        <div class="flex-grow-1 d-flex flex-column">
            <p class="card-text text-dark mb-4 pt-2" style="font-size: 1rem; line-height: 1.6;">{{ answer.text }}</p>
            <div class="mt-auto d-flex justify-content-end">
                <div class="p-2 rounded d-flex gap-2 align-items-center" style="background-color: #e8efe9; min-width: 180px;">
                    <img src="{% avatar_url answer.author %}" class="rounded shadow-sm avatar-36" alt="Avatar">
                    <div class="d-flex flex-column" style="line-height: 1.2;">
                        <span class="text-muted" style="font-size: 0.75rem;">answered {{ answer.created_at|timesince }} ago</span>
                        <span class="text-decoration-none fw-bold" style="color: var(--accent-primary); font-size: 0.85rem;">{% if answer.author %}{{ answer.author.get_username }}{% else %}deleted{% endif %}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
