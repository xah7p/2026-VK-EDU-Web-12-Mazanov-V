<div class="card question-card mb-4">
    <div class="card-body d-flex gap-3">
        <div class="d-flex flex-column align-items-center" style="min-width: 60px;">
            <img src="{{ question.user_avatar }}" class="rounded mb-2" style="width: 40px; height: 40px; background-color: #eee;" alt="Avatar">
            {% include "questions/partials/vote_count.html" with object=question %}
        </div>

        <div class="flex-grow-1">
            <h4 class="question-title mb-1">
                <a href={% url "questions:question" question_id=question.id %}>{{ question.title }}</a>
            </h4>
            <p class="card-text text-secondary mb-2" style="font-size: 0.95rem;">{{ question.text }}</p>
            
            <div class="d-flex flex-wrap gap-2 mt-4 pt-3 border-top">
                {% for curr_tag in question.tags %}
                    <a href={% url "questions:tag" tag_name=curr_tag %} class="badge sidebar-badge tag-boss text-decoration-none">#{{ curr_tag }}</a>
                {% endfor %}
            </div>

            <div class="d-flex justify-content-end text-muted mt-2" style="font-size: 0.85rem;">
                <span>{{ question.answers_count }} answers</span>
                <span class="text-decoration-none text-secondary fw-bold ms-2">{{ question.posting_time }} ago by {{ question.user }}</span>
            </div>
        </div>
    </div>
</div>
